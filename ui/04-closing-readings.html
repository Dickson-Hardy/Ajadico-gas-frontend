<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closing Readings</title><link rel="stylesheet" href="style.css"></head><body><header><b>Closing Readings</b><span>Amaka O. · Morning shift</span></header><main class=""><h1>Closing readings</h1><p class="s">Type each meter reading. Litres and value update as you type.</p><div class="card"><h2>Nozzle 1 · PMS</h2><div class="grid"><div><label for="o1">Opening (L)</label><input id="o1" value="412380.5" readonly></div><div><label for="c1">Closing (L)</label><input id="c1" value="" inputmode=decimal data-n=1></div><div><label for="p1">Price (₦/L)</label><input id="p1" value="1050" readonly></div></div><div class="row" style="margin-top:12px"><span>Litres sold <b id="l1">0.0</b></span><span class="big" id="v1">₦0</span></div></div><div class="card"><h2>Nozzle 2 · PMS</h2><div class="grid"><div><label for="o2">Opening (L)</label><input id="o2" value="388102.0" readonly></div><div><label for="c2">Closing (L)</label><input id="c2" value="" inputmode=decimal data-n=2></div><div><label for="p2">Price (₦/L)</label><input id="p2" value="1050" readonly></div></div><div class="row" style="margin-top:12px"><span>Litres sold <b id="l2">0.0</b></span><span class="big" id="v2">₦0</span></div></div><div class="card"><h2>Nozzle 3 · AGO</h2><div class="grid"><div><label for="o3">Opening (L)</label><input id="o3" value="201775.5" readonly></div><div><label for="c3">Closing (L)</label><input id="c3" value="" inputmode=decimal data-n=3></div><div><label for="p3">Price (₦/L)</label><input id="p3" value="1320" readonly></div></div><div class="row" style="margin-top:12px"><span>Litres sold <b id="l3">0.0</b></span><span class="big" id="v3">₦0</span></div></div><div class="card row"><b>Total expected sales</b><span class="big" id="tot">₦0</span></div><div class="bar"><button class="btn">Submit readings</button><button class="btn alt">Save draft</button></div></main><script>document.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{let t=0;[1,2,3].forEach(n=>{let o=+document.getElementById('o'+n).value,c=+document.getElementById('c'+n).value,p=+document.getElementById('p'+n).value,l=c>o?c-o:0;document.getElementById('l'+n).textContent=l.toFixed(1);document.getElementById('v'+n).textContent='₦'+Math.round(l*p).toLocaleString();t+=l*p});document.getElementById('tot').textContent='₦'+Math.round(t).toLocaleString()})</script></body></html>
