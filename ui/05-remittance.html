<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remittance</title><link rel="stylesheet" href="style.css"></head><body><header><b>Remittance</b><span>Amaka O. · Morning shift</span></header><main class=""><h1>Remittance</h1><p class="s">Declare how the sales were paid. Upload a receipt for every non-cash line.</p><div class="card row"><span>Expected sales value</span><span class="big" id="exp">₦1,250,000</span></div><div class="card"><div class="grid"><div><label for="r1">Cash</label><input id="r1" value="0" inputmode=numeric data-r=1></div><div><label for="r2">POS card</label><input id="r2" value="0" inputmode=numeric data-r=1></div><div><label for="r3">Transfer to station POS account</label><input id="r3" value="0" inputmode=numeric data-r=1></div><div><label for="r4">Transfer to company bank account</label><input id="r4" value="0" inputmode=numeric data-r=1></div></div><div class="ev" style="margin-top:12px">Tap to add POS printout or bank receipt photo</div></div><div class="card"><div class="row"><span>Credit sales (not money received)</span><b>₦180,000</b></div><div class="row"><span>Money declared</span><b id="dec">₦0</b></div><div class="row"><span>Difference</span><span class="big neg" id="dif">₦0</span></div></div><div class="bar"><button class="btn">Submit remittance</button><button class="btn alt">Save draft</button></div></main><script>const E=1250000,C=180000,f=e=>(e<0?'−':e>0?'+':'')+'₦'+Math.abs(e).toLocaleString();document.querySelectorAll('[data-r]').forEach(e=>e.oninput=()=>{let d=0;document.querySelectorAll('[data-r]').forEach(x=>d+=+x.value||0);dec.textContent='₦'+d.toLocaleString();let df=d+C-E;dif.textContent=f(df);dif.className='big '+(df<0?'neg':'pos')})</script></body></html>
