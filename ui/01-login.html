<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body><header><b>Login</b><span>Lekki Road Station · Tablet</span></header><main class=""><h1>Who is using the tablet?</h1><p class="s">Pick your name, then enter your PIN.</p><div class="card"><div class="grid"><button class="btn alt" onclick="document.getElementById('who').textContent='Amaka O.'">Amaka O.</button><button class="btn alt" onclick="document.getElementById('who').textContent='Bello S.'">Bello S.</button><button class="btn alt" onclick="document.getElementById('who').textContent='Chidi E.'">Chidi E.</button><button class="btn alt" onclick="document.getElementById('who').textContent='Fatima A.'">Fatima A.</button></div></div><div class="card" style="text-align:center"><h2>PIN for <span id="who">—</span></h2><input id="pin" type="password" readonly style="max-width:300px;text-align:center;font-size:28px;letter-spacing:8px"><div class="pad"><button class="btn" onclick="p('1')">1</button><button class="btn" onclick="p('2')">2</button><button class="btn" onclick="p('3')">3</button><button class="btn" onclick="p('4')">4</button><button class="btn" onclick="p('5')">5</button><button class="btn" onclick="p('6')">6</button><button class="btn" onclick="p('7')">7</button><button class="btn" onclick="p('8')">8</button><button class="btn" onclick="p('9')">9</button><button class="btn" onclick="pin.value=''">Clear</button><button class="btn" onclick="p(0)">0</button><button class="btn" style="background:var(--ok);color:#fff">Log in</button></div><a href="#">Forgot PIN? Ask your manager</a></div></main><script>const pin=document.getElementById('pin');function p(k){if(pin.value.length<6)pin.value+=k}</script></body></html>
