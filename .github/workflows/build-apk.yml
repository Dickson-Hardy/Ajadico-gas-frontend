name: Build Ajadico Energy Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android platform scaffolding..."
            flutter create --platforms=android --org=com.ajadico.energy .
          fi

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting forecourt tablet hardware permissions..."
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajadico-energy-tablet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "Ajadico Energy Forecourt Kiosk v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### ⛽ Ajadico Energy — Forecourt Station Tablet APK

            **Automated Cloud Release for Android Tablets (Android 8.0+)**

            #### Features Included in this Build:
            - **Forecourt Kiosk Guardrails:** Hardware-back intercept, 60s inactivity watchdog, lockout timers.
            - **Attendant Shift Operations:** Fast PIN login, closing dial entry with isolated draft state, non-cash remittance declaration.
            - **Cashier Safe & Expenses:** Cash drawer denomination counts, bank deposit handovers, dual-approval safe expenses.
            - **Manager & Director Controls:** Underground tank dips (UST), manifold changeovers, CSV/Excel shift export.
            - **Official Branding:** Integrated Ajadico Energy vector emblem and palette.

            *Download the `app-release.apk` attached below and install directly onto your station tablet.*
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
