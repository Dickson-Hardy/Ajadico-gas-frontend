plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Release signing is supplied by the build environment, never a debug fallback.
def releaseSigning = [
    storeFile: System.getenv("ANDROID_KEYSTORE_PATH"),
    storePassword: System.getenv("ANDROID_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("ANDROID_KEY_ALIAS"),
    keyPassword: System.getenv("ANDROID_KEY_PASSWORD")
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.trim().isEmpty() }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains("release") }) {
        if (!hasReleaseSigning || !file(releaseSigning.storeFile).isFile()) {
            throw new GradleException("Release signing is required. Configure ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.")
        }
        if (file(releaseSigning.storeFile).name.equalsIgnoreCase("debug.keystore") ||
                releaseSigning.keyAlias.trim().equalsIgnoreCase("androiddebugkey")) {
            throw new GradleException("The default Android debug identity cannot sign a release.")
        }
    }
}

android {
    namespace = "com.ajadico.energy"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.ajadico.energy"
        minSdk = 24
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {}
