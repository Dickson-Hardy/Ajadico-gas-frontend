workflows:
  android-workflow:
    name: Ajadico Energy Signed Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - ajadico-production
    scripts:
      - name: Install Flutter Packages
        script: flutter pub get
      - name: Verify Source
        script: |
          flutter analyze --no-pub
          flutter test --no-pub --no-test-assets test/
      - name: Validate Configuration and Prepare Signing
        script: |
          python3 scripts/validate_build_config.py
          python3 scripts/prepare_android_signing.py
      - name: Build Signed APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
